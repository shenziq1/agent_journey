<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>查看原文 · Agent Journey</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./original.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-header wrap"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">aj.</span> Agent Journey</a><nav aria-label="返回导航"><a href="./#preface">← 返回前言</a></nav></header>
  <main id="main" class="wrap original-page">
    <section id="gate" class="unlock-card" aria-labelledby="unlock-title">
      <span class="eyebrow">PREFACE / ORIGINAL</span>
      <h1 id="unlock-title">阅读作者原文</h1>
      <p>请输入管理员密码，解锁随笔及后记。</p>
      <form id="unlock-form">
        <label for="password">管理员密码</label>
        <input id="password" name="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="password-note unlock-status">
        <p id="password-note" class="muted">密码区分空格，请准确输入。解锁状态不会保存，刷新后需重新输入。</p>
        <button class="button" type="submit">解锁原文 ↗</button>
        <p id="unlock-status" role="status" aria-live="polite"></p>
      </form>
      <noscript>阅读加密原文需要启用 JavaScript；公开前言无需 JavaScript。</noscript>
    </section>
    <article id="article" class="preface-copy original-article" hidden aria-labelledby="article-title">
      <div class="article-toolbar"><a href="./#preface">← 返回前言</a><button id="lock" type="button">锁定原文</button></div>
      <span class="eyebrow">作者随笔 · 含后记</span>
      <h1 id="article-title" tabindex="-1">我不知道耶</h1>
      <p class="preface-note">以下为作者提供的原文，保留原有段落与表达。</p>
      <div id="article-body"></div>
    </article>
  </main>
</body>
</html>
